apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-tvshows-pv
  namespace: media
spec:
  capacity:
    storage: 34Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - hard
  nfs:
    path: /mnt/vault/TVShows
    server: 10.0.10.7
---
