apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-pv
  namespace: media
spec:
  capacity:
    storage: 25Gi
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicates: '3'
      staleReplicaTimeout: '2880'
    volumeHandle: jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-pv-claim
  namespace: media
spec:
  storageClassName: longhorn
  volumeName: jellyfin-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-tvshows-pv
  namespace: media
spec:
  capacity:
    storage: 34Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - hard
  nfs:
    path: /mnt/vault/TVShows
    server: 10.0.10.7
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-movies-pv
  namespace: media
spec:
  capacity:
    storage: 34Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - hard
  nfs:
    path: /mnt/vault/Movies
    server: 10.0.10.7
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-tv-pvc
  namespace: media
  labels:
    type: nfs
    app: jellyfin
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 34Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-movies-pvc
  namespace: media
  labels:
    type: nfs
    app: jellyfin
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 34Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
  namespace: media
spec:
  selector:
    matchLabels:
      app: jellyfin
      tier: media
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
        tier: media
    spec:
      containers:
      - image: lscr.io/linuxserver/jellyfin:latest
        name: jellyfin
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: Americas\New_York
        ports:
        - containerPort: 8096
          name: jellyfin
        volumeMounts:
        - name: jellyfin-persistent-storage
          mountPath: /config
        - name: jellyfin-tv-storage
          mountPath: /tv
        - name: jellyfin-movies-storage
          mountPath: /movies
        imagePullPolicy: Always
      volumes:
      - name: jellyfin-persistent-storage
        persistentVolumeClaim:
          claimName: jellyfin-pv-claim
      - name: jellyfin-tv-storage
        persistentVolumeClaim:
          claimName: jellyfin-tv-pvc
      - name: jellyfin-movies-storage
        persistentVolumeClaim:
          claimName: jellyfin-movies-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
spec:
  ingressClassName: nginx
  rules:
  - host: jellyfin.dyslexicjedi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port: 
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  labels:
    app: jellyfin
    kubernetes.io/name: "jellyfin"
  namespace: media
spec:
  selector:
    app: jellyfin
  ports:
  - name: jellyfin
    port: 80
    targetPort: 8096
