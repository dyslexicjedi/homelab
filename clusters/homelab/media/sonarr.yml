apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-pv
  namespace: media
spec:
  capacity:
    storage: 25Gi
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      numberOfReplicates: '3'
      staleReplicaTimeout: '2880'
    volumeHandle: sonarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-pv-claim
  namespace: media
spec:
  storageClassName: longhorn
  volumeName: sonarr-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-tvshows-pv
  namespace: media
spec:
  capacity:
    storage: 34Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - hard
  nfs:
    path: /mnt/vault/TVShows
    server: 10.0.10.7
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-downloads-pv
  namespace: media
spec:
  capacity:
    storage: 800Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - hard
  nfs:
    path: /mnt/vault/Sync
    server: 10.0.10.7
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-tv-pvc
  namespace: media
  labels:
    type: nfs
    app: sonarr
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 34Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-download-pvc
  namespace: media
  labels:
    type: nfs
    app: sonarr
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 800Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
  namespace: media
spec:
  selector:
    matchLabels:
      app: sonarr
      tier: media
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarr
        tier: media
    spec:
      containers:
      - image: lscr.io/linuxserver/sonarr:latest
        name: sonarr
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: Americas\New_York
        ports:
        - containerPort: 8989
          name: sonarr
        volumeMounts:
        - name: sonarr-persistent-storage
          mountPath: /config
        - name: sonarr-tv-storage
          mountPath: /tv
        - name: sonarr-download-storage
          mountPath: /data
        imagePullPolicy: Always
      volumes:
      - name: sonarr-persistent-storage
        persistentVolumeClaim:
          claimName: sonarr-pv-claim
      - name: sonarr-tv-storage
        persistentVolumeClaim:
          claimName: sonarr-tv-pvc
      - name: sonarr-download-storage
        persistentVolumeClaim:
          claimName: sonarr-download-pvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
spec:
  ingressClassName: nginx
  rules:
  - host: sonarr.dyslexicjedi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarr
            port: 
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  labels:
    app: sonarr
    kubernetes.io/name: "sonarr"
  namespace: media
spec:
  selector:
    app: sonarr
  ports:
  - name: sonarr
    port: 80
    targetPort: 8989